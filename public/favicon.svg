<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#534133;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#95684C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BF9663;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="hammerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BF9663;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Sparkle effect -->
    <radialGradient id="sparkle">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BF9663;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="500" height="500" rx="80" fill="url(#bgGrad)"/>
  
  <!-- Outer glow circle -->
  <circle cx="250" cy="250" r="180" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.3"/>
  
  <!-- Auction Gavel/Hammer -->
  <!-- Hammer Head -->
  <rect x="180" y="120" width="100" height="60" rx="10" fill="url(#hammerGrad)" transform="rotate(-25 230 150)"/>
  <rect x="170" y="130" width="80" height="40" rx="8" fill="#FFFFFF" opacity="0.3" transform="rotate(-25 210 150)"/>
  
  <!-- Hammer Handle -->
  <rect x="200" y="180" width="30" height="160" rx="15" fill="#95684C" transform="rotate(-25 215 260)"/>
  <rect x="205" y="185" width="20" height="150" rx="10" fill="#BF9663" opacity="0.5" transform="rotate(-25 215 260)"/>
  
  <!-- Sound Base (Gavel Block) -->
  <ellipse cx="350" cy="370" rx="70" ry="20" fill="#534133" opacity="0.6"/>
  <rect x="290" y="350" width="120" height="35" rx="5" fill="#95684C"/>
  <rect x="300" y="355" width="100" height="10" rx="3" fill="#BF9663" opacity="0.6"/>
  
  <!-- Impact Lines (Action Effect) -->
  <path d="M 320 330 L 310 310" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 340 325 L 335 305" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 360 330 L 360 310" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 380 330 L 385 310" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Sparkles -->
  <circle cx="150" cy="150" r="8" fill="url(#sparkle)"/>
  <circle cx="380" cy="120" r="6" fill="url(#sparkle)"/>
  <circle cx="420" cy="280" r="7" fill="url(#sparkle)"/>
  <circle cx="100" cy="320" r="6" fill="url(#sparkle)"/>
  
  <!-- Dollar Sign (Subtle) -->
  <text x="400" y="450" font-family="Arial, sans-serif" font-size="100" font-weight="bold" fill="#BF9663" opacity="0.3">$</text>
  
  <!-- SHL Text Badge -->
  <rect x="40" y="40" width="100" height="50" rx="10" fill="#000000" opacity="0.7"/>
  <text x="90" y="73" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#BF9663" text-anchor="middle">SHL</text>
</svg>
